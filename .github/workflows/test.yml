name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.2', '8.3']
        kirby-versions: ['^4.1', '^5.0']
        include:
          - php-versions: '8.4'
            kirby-versions: '^5.0'

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php-versions }}-kirby${{ matrix.kirby-versions }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-versions }}-kirby${{ matrix.kirby-versions }}-

    - name: Install dependencies
      run: |
        composer require --dev "getkirby/cms:${{ matrix.kirby-versions }}" --no-update
        composer update --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    - name: Run test suite
      run: composer test
